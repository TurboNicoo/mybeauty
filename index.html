<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Beauty</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FF6F91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme: light;
  --bg:#FFF3F7; --bg2:#FFE3ED; --card:#FFFFFF; --card2:#FFF8FA;
  --rose:#FF6F91; --rose-deep:#E63969; --maroon:#4A1030; --lilac:#C9A7EB; --gold:#F4B942;
  --text:#3B2430; --muted:#93707d; --border:#FFD3E1;
  --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px);
  padding-top: var(--safe-t); padding-bottom: var(--safe-b);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A0F1E; --bg2:#3A1428; --card:#3D1729; --card2:#341321;
    --rose:#FF7FA0; --rose-deep:#FF5580; --maroon:#F7D6E4; --lilac:#D7B9F2; --gold:#F7C863;
    --text:#FBE4ED; --muted:#C48FA0; --border:#5A2140;
  }
}
:root[data-theme="dark"]{
  --bg:#2A0F1E; --bg2:#3A1428; --card:#3D1729; --card2:#341321;
  --rose:#FF7FA0; --rose-deep:#FF5580; --maroon:#F7D6E4; --lilac:#D7B9F2; --gold:#F7C863;
  --text:#FBE4ED; --muted:#C48FA0; --border:#5A2140;
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 400px);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px;min-height:100vh;}
img{max-width:100%;}
[hidden]{display:none!important;}
h1,h2,h3{margin:0 0 4px;}
p{margin:0 0 8px;line-height:1.45;}
.wrap{max-width:560px;margin:0 auto;padding-bottom:48px;}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:var(--safe-t);background:linear-gradient(180deg,var(--bg) 80%,transparent);z-index:5;}
.hero{position:relative;margin:0 -16px 34px;overflow:hidden;background:linear-gradient(155deg,var(--rose) 0%,var(--lilac) 100%);}
.hero-img{display:block;width:100%;height:min(58vw,320px);min-height:220px;object-fit:cover;object-position:50% 12%;mix-blend-mode:multiply;opacity:.94;}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,var(--bg) 96%);pointer-events:none;}
.hero-caption{position:absolute;left:20px;bottom:34px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25);}
.hero-caption .eyebrow{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;font-weight:700;}
.hero-caption .line{display:block;font-size:19px;font-weight:800;margin-top:2px;}
.heart-badge{position:absolute;right:24px;bottom:-16px;width:50px;height:50px;filter:drop-shadow(0 4px 10px rgba(74,16,48,.28));}
.heart-shape{position:absolute;inset:7px 7px 11px 7px;transform:rotate(-45deg);background:var(--rose-deep);}
.heart-shape::before,.heart-shape::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;background:var(--rose-deep);}
.heart-shape::before{top:-50%;left:0;}
.heart-shape::after{top:0;left:50%;}
.heart-shape.light,.heart-shape.light::before,.heart-shape.light::after{background:#fff;}
.heart-letter.dark{color:var(--rose-deep);}
.heart-letter{position:absolute;inset:0 0 6px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;z-index:2;font-family:Georgia,"Times New Roman",serif;}
.splash{position:fixed;inset:0;z-index:100;background:var(--maroon);display:flex;align-items:flex-end;justify-content:center;opacity:1;transition:opacity .35s ease;}
.splash.hide{opacity:0;pointer-events:none;}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%;mix-blend-mode:multiply;opacity:.92;}
.splash::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,var(--rose) 0%,var(--lilac) 120%);}
.splash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(to top,var(--maroon) 15%,rgba(74,16,48,0));pointer-events:none;}
.splashname{position:absolute;z-index:1;top:calc(env(safe-area-inset-top,0px) + 26px);left:50%;transform:translateX(-50%);font-weight:800;font-size:21px;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.splashname .sw1{color:#fff;}
.splashname .sw2{color:var(--gold);}
.splashheart{position:relative;z-index:1;width:40px;height:40px;margin-bottom:14px;}
.splashbtn{position:relative;z-index:1;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 44px);background:#fff;color:var(--rose-deep);font-weight:800;font-size:17px;letter-spacing:.02em;padding:16px 46px;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.35);border:0;cursor:pointer;}
.splashbtn:active{transform:scale(.97);}
.splashsub{position:relative;z-index:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);font-size:13.5px;margin-bottom:14px;text-align:center;padding:0 30px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--rose-deep);}
.brand .heart{color:var(--rose);}
.backbtn{background:none;border:none;color:var(--rose-deep);font-size:15px;font-weight:700;padding:8px 4px;cursor:pointer;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(230,57,105,0.06);}
.card.soft{background:var(--card2);}
.pill{display:inline-block;background:var(--bg2);color:var(--rose-deep);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:6px;}
.muted{color:var(--muted);font-size:13px;}
.btn{display:inline-block;background:var(--rose);color:#fff;border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;}
.btn.ghost{background:transparent;color:var(--rose-deep);border:2px solid var(--rose);}
.btn.block{display:block;width:100%;}
.btn:active{transform:scale(0.98);}
.row{display:flex;gap:10px;align-items:center;}
.between{justify-content:space-between;}
.wrapcards{display:flex;flex-direction:column;gap:12px;}
.hearts-progress{display:flex;gap:3px;}
.hearts-progress span{font-size:14px;opacity:0.25;}
.hearts-progress span.on{opacity:1;}
.blockcard{cursor:pointer;position:relative;overflow:hidden;}
.blockcard .num{position:absolute;right:14px;top:10px;font-size:44px;font-weight:900;color:var(--bg2);z-index:0;}
.blockcard .inner{position:relative;z-index:1;}
.blockcard .bar{height:8px;background:var(--bg2);border-radius:99px;margin-top:10px;overflow:hidden;}
.blockcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:99px;}
.daybtn{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;}
.daybtn:active{background:var(--bg2);}
.exitem{border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--card);}
.exitem.done{background:linear-gradient(135deg,var(--card),var(--bg2));border-color:var(--rose);}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:8px;}
.exname{font-weight:800;font-size:15.5px;}
.exmeta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.exscheme{text-align:right;font-size:13px;color:var(--rose-deep);font-weight:700;white-space:nowrap;}
.exbody{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
.exbody h4{margin:0 0 4px;font-size:12.5px;color:var(--rose-deep);text-transform:uppercase;letter-spacing:.03em;}
.note{background:var(--bg2);border-left:3px solid var(--rose);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px;}
.setrow input{width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;}
.setrow .setno{font-weight:800;color:var(--muted);font-size:13px;text-align:center;}
.checkbtn{width:32px;height:32px;border-radius:50%;border:2px solid var(--rose);background:transparent;color:var(--rose);font-size:16px;cursor:pointer;}
.checkbtn.on{background:var(--rose);color:#fff;}
.love{background:linear-gradient(135deg,var(--rose),var(--lilac));color:#fff;border-radius:20px;padding:16px;margin-bottom:14px;}
.love summary{cursor:pointer;font-weight:800;list-style:none;}
.love summary::-webkit-details-marker{display:none;}
.love p{margin-top:10px;font-size:14.5px;line-height:1.55;}
.footer{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0 10px;}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;}
.chip{font-size:11.5px;background:var(--bg2);color:var(--rose-deep);border-radius:99px;padding:3px 9px;font-weight:700;}
.dayhero{background:linear-gradient(135deg,var(--rose-deep),var(--rose));color:#fff;border-radius:20px;padding:18px;margin-bottom:16px;}
.dayhero .muted{color:rgba(255,255,255,0.85);}
.infobox{font-size:14px;line-height:1.55;}
.infobox ul{padding-left:18px;margin:6px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--maroon);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.navdots{display:flex;gap:6px;justify-content:center;margin:6px 0 2px;}
.navdots span{width:6px;height:6px;border-radius:50%;background:var(--border);}
.navdots span.on{background:var(--rose);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="splash" id="splash">
  <div class="splashname"><span class="sw1">My</span> <span class="sw2">Beauty</span></div>
  <img src="hero-woman.jpg" alt="">
  <div class="splashsub">12 weken sterker — enkel, billen, buik & bovenlijf</div>
  <div class="splashheart"><div class="heart-shape light" style="inset:0;"></div><div class="heart-letter dark">N</div></div>
  <button class="splashbtn" id="splashGo">Let's go</button>
</div>
<script>
/* ===================== EXERCISE LIBRARY ===================== */
const EX = {
  enkel_circles:{n:"Enkelcirkels",m:"Enkel / kuit",eq:"Geen materiaal",
    how:"Til één voet van de grond (zittend of staand met steun). Maak grote, langzame cirkels met je voet vanuit de enkel: 10x rechtsom, 10x linksom. Herhaal aan de andere kant.",
    note:"Warming-up — rustig en pijnvrij, dit hoort bij elke training."},
  tibialis_raises:{n:"Tibialis raises",m:"Scheenbeen (voorkant onderbeen)",eq:"Muur",
    how:"Sta met je hielen tegen de muur, tenen een klein stukje van de muur af. Til je tenen zo hoog mogelijk op richting je scheenbeen, houd 1 seconde vast, laat rustig zakken.",
    note:"Versterkt de spier aan de vóórkant van je onderbeen — samen met je kuit houdt die je enkel in balans. Heel gericht op jouw doel."},
  calf_raises_2been:{n:"Calf raises (2 benen)",m:"Kuiten",eq:"Eigen gewicht",
    how:"Sta rechtop, eventueel met lichte vingersteun. Kom langzaam op je tenen, knijp 1 seconde samen boven, zak gecontroleerd terug — geen wippen."},
  calf_raises_1been_support:{n:"Calf raise op 1 been (met steun)",m:"Kuiten / enkel",eq:"Eigen gewicht",
    how:"Zelfde beweging als de 2-benige calf raise, maar op één been, met lichte vingersteun aan een stang of muur voor balans.",
    note:"Bouw pas hier naartoe als de 2-benige versie volledig zonder klachten voelt."},
  eccentrische_calf_raise:{n:"Eccentrische calf raise",m:"Kuiten / enkel",eq:"Opstapje",
    how:"Kom op 2 benen omhoog op je tenen aan de rand van een opstapje. Til dan één voet op en zak heel langzaam (4-5 tellen) op één been naar beneden.",
    note:"Het langzame zakken is waar de winst zit — niet de snelheid."},
  balans_1been_support:{n:"Eénbenige balans (met steun)",m:"Enkel / voet",eq:"Geen materiaal",
    how:"Sta op één been met lichte vingersteun aan iets stevigs. Probeer 20-30 sec stabiel te staan zonder je andere voet neer te zetten.",
    note:"Traint precies de kleine stabiliserende spieren rond je enkel die druk rond het plaatje beter helpen opvangen."},
  balans_1been_vrij:{n:"Eénbenige balans (vrij)",m:"Enkel / voet",eq:"Geen materiaal",
    how:"Zelfde als de ondersteunde balansoefening, maar zonder steun. Voor extra uitdaging: kijk even weg van je standbeen of sluit je ogen.",
    note:"Alleen doen als de ondersteunde versie moeiteloos voelt. Sta in de buurt van iets om vast te pakken."},
  enkelband_weerstand:{n:"Enkelband weerstand (in/eversie)",m:"Enkel stabilisatoren",eq:"Weerstandsband",
    how:"Maak de band vast om een stevig punt en plaats je voet in de lus. Beweeg je voet rustig naar binnen en naar buiten tegen de weerstand in.",
    note:"Direct gericht op de spieren die je enkel zíjwaarts stabiliseren — vaak het meest vergeten stukje na een enkelblessure."},
  goblet_squat_box:{n:"Goblet squat naar box",m:"Bovenbenen / billen",eq:"Dumbbell + bankje",
    how:"Houd een dumbbell verticaal tegen je borst. Zak rustig naar achteren/beneden tot je de box net raakt, kom weer omhoog.",
    note:"De box geeft een vaste, veilige diepte — fijn om zonder zorgen op je enkel te vertrouwen."},
  leg_press:{n:"Beenpers (leg press)",m:"Bovenbenen / billen",eq:"Legpress-machine",
    how:"Voeten schouderbreedte op de plaat. Buig je knieën tot ongeveer 90°, druk terug tot bijna gestrekt (niet doorknallen).",
    note:"De machine ondersteunt de beweging volledig — een fijne, enkel-veilige manier om beenkracht op te bouwen."},
  leg_extension:{n:"Leg extension",m:"Quadriceps (voorkant bovenbeen)",eq:"Machine",
    how:"Zit rechtop, strek je onderbenen tot bijna gestrekt, knijp kort samen boven, laat rustig zakken."},
  leg_curl:{n:"Leg curl",m:"Hamstrings (achterkant bovenbeen)",eq:"Machine",
    how:"Buig je onderbenen richting je billen, knijp de hamstrings samen, laat gecontroleerd terug."},
  hip_thrust_bank:{n:"Hip thrust",m:"Billen",eq:"Bank (+ later barbell)",
    how:"Rug tegen de bank, voeten plat op de grond. Duw je heupen omhoog tot je lichaam een rechte lijn vormt van schouders tot knieën, knijp je billen boven samen.",
    note:"Eén van de beste bil-oefeningen die er zijn — en heel vriendelijk voor je enkel."},
  glute_bridge:{n:"Glute bridge",m:"Billen",eq:"Eigen gewicht",
    how:"Lig op je rug, knieën gebogen, voeten plat op de grond. Duw je heupen omhoog, knijp je billen samen boven, zak rustig terug."},
  cable_kickback:{n:"Cable kickback",m:"Billen",eq:"Kabelmachine",
    how:"Enkelmanchet om je enkel, sta voorovergebogen met lichte steun. Strek je been recht naar achteren, knijp de bil samen, kom rustig terug."},
  hip_abductie_machine:{n:"Hip abductie machine",m:"Zij-bil",eq:"Machine",
    how:"Zit rechtop, duw je knieën naar buiten tegen de weerstand in, houd kort vast, laat rustig terug."},
  romanian_deadlift_licht:{n:"Romanian deadlift (licht)",m:"Hamstrings / billen / rug",eq:"Dumbbells",
    how:"Lichte buiging in de knieën. Buig vanuit je heupen naar voren met een rechte rug, dumbbells dicht langs je benen, tot je een rek voelt in je hamstrings, kom weer omhoog.",
    note:"De beweging komt uit je heup, niet uit je onderrug — rug blijft de hele tijd recht/neutraal."},
  split_squat_stationair:{n:"Split squat (stilstaand)",m:"Bovenbenen / billen",eq:"Eigen gewicht / dumbbells",
    how:"Grote stap naar voren, beide voeten blijven op de grond staan (geen lopen). Zak recht naar beneden tot beide knieën ~90°, kom terug omhoog.",
    note:"In tegenstelling tot loop-uitvallen belast dit je enkel veel gecontroleerder, omdat je voeten stil blijven staan."},
  bulgarian_split_squat:{n:"Bulgaarse split squat (met steun)",m:"Bovenbenen / billen",eq:"Bank + dumbbells",
    how:"Achtervoet op een bank, voorvoet stevig op de grond. Zak recht naar beneden, kom terug omhoog.",
    note:"Pak eventueel iets vast voor balans — de focus ligt op controle, niet op snelheid."},
  step_up:{n:"Step-up",m:"Bovenbenen / billen",eq:"Box / bankje",
    how:"Stap met één voet op de box, druk jezelf omhoog tot je er bovenop staat, stap gecontroleerd weer terug naar beneden.",
    note:"Begin met een lage box en bouw de hoogte pas op als het pijnvrij en stabiel voelt."},
  sumo_squat:{n:"Sumo squat",m:"Binnenbeen / billen",eq:"Dumbbell / kettlebell",
    how:"Brede stand, tenen licht naar buiten. Zak recht naar beneden, houd je rug neutraal, kom omhoog."},
  walking_lunge_licht:{n:"Walking lunges (licht, vlakke vloer)",m:"Bovenbenen / billen",eq:"Eigen gewicht / lichte dumbbells",
    how:"Stap naar voren, zak tot beide knieën ~90°, druk af en stap door naar de volgende lunge.",
    note:"Alleen op vlakke, stevige ondergrond. Stop als je enkel instabiel voelt en ga terug naar de stilstaande split squat."},
  single_leg_rdl:{n:"Single-leg RDL",m:"Hamstrings / billen / balans",eq:"Lichte dumbbell",
    how:"Sta op één been, buig vanuit de heup voorover terwijl je andere been naar achter zwaait voor balans, kom weer rechtop.",
    note:"Combineert balans + enkelkracht + bilkracht in één — precies jouw doel, maar wel gevorderd. Pak iets vast zodra je wankelt."},
  farmers_walk:{n:"Farmer's walk",m:"Hele lichaam / core / grip",eq:"Dumbbells / kettlebells",
    how:"Pak twee stevige dumbbells, sta rechtop en loop met kleine, gecontroleerde passen een stuk (20-30m), rug recht, buik licht aangespannen.",
    note:"Laag risico, hoge waarde: traint je hele lichaam inclusief onderbeen-stabiliteit, zonder enige impact."},
  dumbbell_shoulder_press_zit:{n:"Zittende dumbbell shoulder press",m:"Schouders",eq:"Dumbbells + bank",
    how:"Zit rechtop, dumbbells op schouderhoogte, druk recht omhoog tot je armen bijna gestrekt zijn, laat rustig zakken."},
  chest_press_machine:{n:"Chest press (machine)",m:"Borst",eq:"Machine",
    how:"Zit rechtop, handvatten op borsthoogte, druk naar voren tot je armen bijna gestrekt zijn, laat rustig terug."},
  pushup_knie:{n:"Push-up op de knieën",m:"Borst / triceps / schouders",eq:"Eigen gewicht",
    how:"Knieën op de grond, handen iets breder dan schouderbreedte. Zak je borst naar de grond, druk terug omhoog — lichaam recht van hoofd tot knieën."},
  pushup_normaal:{n:"Push-up (volledig)",m:"Borst / triceps / schouders",eq:"Eigen gewicht",
    how:"Zelfde als de knie-push-up, maar op je tenen — lichaam recht van hoofd tot hiel."},
  dumbbell_bench_press:{n:"Dumbbell bench press",m:"Borst",eq:"Dumbbells + bank",
    how:"Lig op de bank, dumbbells op borsthoogte, druk omhoog tot je armen bijna gestrekt zijn, laat gecontroleerd zakken."},
  triceps_pushdown:{n:"Triceps pushdown (kabel)",m:"Triceps",eq:"Kabelmachine",
    how:"Ellebogen dicht bij je lichaam, duw de stang/het touw naar beneden tot je armen gestrekt zijn, kom rustig terug."},
  lateral_raise:{n:"Lateral raise",m:"Schouders (zijkant)",eq:"Lichte dumbbells",
    how:"Til de dumbbells zijwaarts tot schouderhoogte, lichte buiging in de ellebogen, laat rustig zakken."},
  lat_pulldown:{n:"Lat pulldown",m:"Rug / biceps",eq:"Kabelmachine",
    how:"Grijp de stang breed vast, trek naar je bovenborst terwijl je je schouderbladen naar beneden en naar elkaar toe trekt, laat gecontroleerd terug."},
  seated_cable_row:{n:"Seated cable row",m:"Rug / biceps",eq:"Kabelmachine",
    how:"Rug recht, trek de handvatten naar je buik, knijp je schouderbladen samen, laat gecontroleerd terug."},
  dumbbell_row:{n:"Dumbbell row",m:"Rug / biceps",eq:"Dumbbell + bank",
    how:"Eén knie en hand op de bank, andere voet op de grond. Trek de dumbbell omhoog naar je heup, laat gecontroleerd zakken."},
  face_pull:{n:"Face pull",m:"Achterste schouders / rug",eq:"Kabel of band",
    how:"Trek het touw of de band naar je gezicht toe, ellebogen hoog, knijp je schouderbladen samen.",
    note:"Belangrijk voor een gezonde schouderhouding — vaak een vergeten oefening, maar heel waardevol."},
  band_pull_apart:{n:"Band pull-apart",m:"Achterste schouders / rug",eq:"Weerstandsband",
    how:"Houd de band met gestrekte armen voor je, trek uit elkaar tot je schouderbladen samenknijpen, laat rustig terug."},
  buikademhaling:{n:"Buikademhaling / core-activatie",m:"Diepe buikspieren",eq:"Geen materiaal",
    how:"Lig op je rug, knieën gebogen. Adem rustig in door je neus en laat je buik bollen. Adem uit en span heel licht je onderbuik aan (alsof je een rits dichttrekt), zonder je adem vast te houden.",
    note:"Het startpunt van elke core-oefening na buikoperaties: rustig, zonder persen. Dit is de basis, niet de zware training."},
  dead_bug:{n:"Dead bug",m:"Diepe buikspieren",eq:"Eigen gewicht",

const DAYLABELS = ["Dag A","Dag B","Dag C"];

/* Every (block, week, day, item) slot a given exercise id appears in, so we can look up
   "vorige keer" (last time) for that exercise anywhere in the 12 weeks, not just this slot. */
const EX_LOCATIONS = {};
PROGRAM.forEach(b=>{
  b.weeks.forEach(w=>{
    b.days[w].forEach((day,di)=>{
      day.forEach((it,ii)=>{
        const exId = it[0];
        (EX_LOCATIONS[exId] = EX_LOCATIONS[exId] || []).push(slotKey(b.id,w,di,ii));
      });
    });
  });
});

/* ===================== STATE ===================== */
const LSKEY = "mybeauty_v1";
let S = {logs:{}, note:{}};
try{ const raw = localStorage.getItem(LSKEY); if(raw) S = JSON.parse(raw); }catch(e){}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }

function parseSetCount(sr){
  const m = /^(\d+)\s*x/i.exec(sr.trim());
  return m ? Math.min(parseInt(m[1],10), 6) : 3;
}
function slotKey(blockId, week, dayIdx, itemIdx){ return blockId+"_"+week+"_"+dayIdx+"_"+itemIdx; }
function getSets(key, n){
  if(!S.logs[key]) S.logs[key] = [];
  while(S.logs[key].length < n) S.logs[key].push({w:"",r:"",done:false,ts:0});
  return S.logs[key];
}
/* Most recently logged set for this exercise anywhere else in the program — "vorige keer". */
function priorBest(exId, excludeKey){
  let best = null;
  (EX_LOCATIONS[exId] || []).forEach(k=>{
    if(k === excludeKey) return;
    const sets = S.logs[k];
    if(!sets) return;
    sets.forEach(s=>{
      if(!s.done || !s.w) return;
      if(!best || (s.ts||0) > (best.ts||0)) best = s;
    });
  });
  return best;
}
function numKg(v){ const n = parseFloat((v+"").replace(",",".")); return isNaN(n) ? null : n; }
function dayDone(blockId, week, dayIdx){
  const items = PROGRAM.find(b=>b.id===blockId).days[week][dayIdx];
  return items.every((it,i)=>{
    const n = parseSetCount(it[1]);
    const sets = S.logs[slotKey(blockId,week,dayIdx,i)];
    return sets && sets.length>=n && sets.slice(0,n).every(s=>s.done);
  });
}
function blockProgress(blockId){
  const block = PROGRAM.find(b=>b.id===blockId);
  let total=0, done=0;
  block.weeks.forEach(w=>{
    block.days[w].forEach((items,di)=>{ total++; if(dayDone(blockId,w,di)) done++; });
  });
  return {done,total};
}

/* ===================== ROUTER ===================== */
let ROUTE = {view:"home"};
const app = document.getElementById("app");
function go(route){ pushHist(); ROUTE = route; render(); window.scrollTo(0,0); }

function render(){
  if(ROUTE.view==="home") return renderHome();
  if(ROUTE.view==="block") return renderBlock(ROUTE.blockId);
  if(ROUTE.view==="day") return renderDay(ROUTE.blockId, ROUTE.week, ROUTE.dayIdx);
  if(ROUTE.view==="info") return renderInfo();
}

function topbar(title, back){
  return '<div class="top"><div class="brand">'+
    (back?('<button class="backbtn" onclick="history_back()">‹ Terug</button>'):('<span class="heart">♥</span> My Beauty'))+
    '</div>'+(back?'':'<button class="backbtn" onclick="go({view:\'info\'})">ℹ️ Info</button>')+'</div>'+
    (title?('<h2 style="margin:2px 0 14px;">'+title+'</h2>'):'');
}
let HIST = [];
function pushHist(){ HIST.push(JSON.stringify(ROUTE)); }
function history_back(){ if(HIST.length){ ROUTE = JSON.parse(HIST.pop()); render(); } else { go({view:"home"}); } window.scrollTo(0,0); }

function renderHome(){
  HIST = [];
  let totalDone=0, totalAll=0;
  PROGRAM.forEach(b=>{ const p=blockProgress(b.id); totalDone+=p.done; totalAll+=p.total; });
  let html = '<div class="top"><div class="brand"><span class="heart">♥</span> My Beauty</div>'+
    '<button class="backbtn" onclick="go({view:\'info\'})">ℹ️ Info</button></div>';

  html += '<div class="hero">'+
      '<img class="hero-img" src="hero-woman.jpg" alt="">'+
      '<div class="hero-fade"></div>'+
      '<div class="hero-caption"><span class="eyebrow">Jouw 12 weken</span><span class="line">Sterker, met liefde</span></div>'+
      '<div class="heart-badge"><div class="heart-shape"></div><div class="heart-letter">N</div></div>'+
    '</div>';

  html += '<p class="muted">12 weken, 3x per week fullbody — voor sterke enkels, voeten, billen, buik en bovenlijf. '+totalDone+' / '+totalAll+' trainingen gelogd '+heartsFor(totalDone,totalAll)+'</p>';

  html += '<details class="love"><summary>💌 Een berichtje van Nico — tik om te lezen</summary>'+
    '<p>Dit schema heb ik speciaal voor jou gemaakt: rustig opbouwen rond je enkel, je buik weer sterk maken op jouw tempo, en tegelijk lekker aan je billen, buik en bovenlijf werken. Elke training telt, ook een kleine. Ik ben apetrots op je bij elke stap. I love you. — Nico ♥</p></details>';

  html += '<div class="wrapcards">';
  PROGRAM.forEach(b=>{
    const p = blockProgress(b.id);
    const pct = p.total? Math.round(100*p.done/p.total) : 0;
    html += '<div class="card blockcard" onclick=\'go({view:"block",blockId:'+b.id+'})\'>'+
      '<div class="num">'+b.id+'</div>'+
      '<div class="inner">'+
      '<div class="pill">Week '+b.weeks[0]+'-'+b.weeks[1]+'</div>'+
      '<h3>'+b.title+'</h3>'+
      '<p class="muted">'+b.focus+'</p>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<p class="muted" style="margin-top:6px;">'+p.done+' / '+p.total+' trainingen • '+pct+'%</p>'+
      '</div></div>';
  });
  html += '</div>';
  html += '<div class="footer">Gemaakt met ❤️ door Nico &nbsp;•&nbsp; My Beauty v1</div>';
  app.innerHTML = html;
}

function heartsFor(done,total){
  if(!total) return "";
  const n = Math.min(5, Math.round(5*done/total));
  let s = "";
  for(let i=0;i<5;i++) s += '<span style="opacity:'+(i<n?1:0.25)+'">♥</span>';
  return s;
}

function renderBlock(blockId){
  const b = PROGRAM.find(x=>x.id===blockId);
  let html = topbar(b.title, true);
  html += '<div class="card soft"><p>'+b.focus+'</p></div>';
  b.weeks.forEach(w=>{
    html += '<h3 style="margin:18px 0 8px;">Week '+w+'</h3>';
    b.days[w].forEach((items,di)=>{
      const done = dayDone(blockId,w,di);
      html += '<div class="daybtn" onclick=\'go({view:"day",blockId:'+blockId+',week:'+w+',dayIdx:'+di+'})\'>'+
        '<div><strong>'+DAYLABELS[di]+'</strong><div class="muted">'+items.length+' oefeningen</div></div>'+
        '<div style="font-size:20px;">'+(done?'💗':'🤍')+'</div></div>';
    });
  });
  app.innerHTML = html;
}

function renderDay(blockId, week, dayIdx){
  const b = PROGRAM.find(x=>x.id===blockId);
  const items = b.days[week][dayIdx];
  let html = topbar(null, true);
  html += '<div class="dayhero"><div class="pill" style="background:rgba(255,255,255,.25);color:#fff;">Blok '+blockId+' • Week '+week+'</div>'+
    '<h2 style="margin:6px 0 2px;color:#fff;">'+DAYLABELS[dayIdx]+' — Fullbody</h2>'+
    '<p class="muted">'+items.length+' oefeningen • warm eerst rustig op</p></div>';

  items.forEach((it,i)=>{
    const [exId, sr, rpe, rest] = it;
    const ex = EX[exId];
    const n = parseSetCount(sr);
    const key = slotKey(blockId,week,dayIdx,i);
    const sets = getSets(key, n);
    const done = sets.slice(0,n).every(s=>s.done);
    const openAttr = S.note["_open_"+key] ? '' : ' hidden';
    const prior = priorBest(exId, key);
    html += '<div class="exitem'+(done?' done':'')+'" id="ex_'+i+'">'+
      '<div class="exhead" onclick="toggleEx('+blockId+','+week+','+dayIdx+','+i+')">'+
        '<div><div class="exname">'+(done?'💗 ':'')+ex.n+'</div><div class="exmeta">'+ex.m+' • '+ex.eq+'</div></div>'+
        '<div class="exscheme">'+sr+'<br><span class="muted">'+rpe+(rest!=="-"?(' • rust '+rest):'')+'</span></div>'+
      '</div>'+
      '<div class="exbody"'+openAttr+' id="body_'+i+'">'+
        '<h4>Zo doe je het</h4><p>'+ex.how+'</p>'+
        (ex.note?('<div class="note">💡 '+ex.note+'</div>'):'')+
        (prior?('<div class="note">📈 Vorige keer: <strong>'+esc(prior.w)+' kg × '+esc(prior.r)+'</strong> — probeer dit te evenaren of te verslaan!</div>'):'')+
        '<h4 style="margin-top:12px;">Log je sets</h4>'+
        setsRows(blockId,week,dayIdx,i,sets,n,prior)+
      '</div></div>';
  });

  html += '<button class="btn block" style="margin-top:14px;" onclick="finishDay('+blockId+','+week+','+dayIdx+')">Dag afronden ♥</button>';
  app.innerHTML = html;
}

function setsRows(blockId,week,dayIdx,itemIdx,sets,n,prior){
  let h = "";
  const priorKg = prior ? numKg(prior.w) : null;
  for(let s=0;s<n;s++){
    const row = sets[s];
    const rowKg = numKg(row.w);
    const beats = row.done && priorKg!=null && rowKg!=null && rowKg>priorKg;
    h += '<div class="setrow">'+
      '<div class="setno">'+(s+1)+'</div>'+
      '<input type="text" inputmode="decimal" placeholder="kg" value="'+esc(row.w)+'" onchange="updateSet('+blockId+','+week+','+dayIdx+','+itemIdx+','+s+',\'w\',this.value)">'+
      '<input type="text" inputmode="numeric" placeholder="reps" value="'+esc(row.r)+'" onchange="updateSet('+blockId+','+week+','+dayIdx+','+itemIdx+','+s+',\'r\',this.value)">'+
      '<button class="checkbtn'+(row.done?' on':'')+'" onclick="toggleSet('+blockId+','+week+','+dayIdx+','+itemIdx+','+s+')">'+(row.done?'✓':'')+'</button>'+
      '</div>'+
      (beats?'<div class="note" style="margin-top:4px;">🔥 Sterker dan vorige keer!</div>':'');
  }
  return h;
}
function esc(v){ return (v+"").replace(/"/g,"&quot;"); }

function toggleEx(blockId,week,dayIdx,itemIdx){
  const k = "_open_"+slotKey(blockId,week,dayIdx,itemIdx);
  S.note[k] = !S.note[k];
  const el = document.getElementById("body_"+itemIdx);
  if(el) el.hidden = !S.note[k];
}
function updateSet(blockId,week,dayIdx,itemIdx,setIdx,field,val){
  const k = slotKey(blockId,week,dayIdx,itemIdx);
  S.logs[k][setIdx][field] = val;
  save();
}
function toggleSet(blockId,week,dayIdx,itemIdx,setIdx){
  const k = slotKey(blockId,week,dayIdx,itemIdx);
  const row = S.logs[k][setIdx];
  row.done = !row.done;
  if(row.done) row.ts = Date.now();
  save();
  renderDay(blockId,week,dayIdx);
}
function finishDay(blockId,week,dayIdx){
  save();
  showToast(dayDone(blockId,week,dayIdx) ? "Helemaal gelogd — trots op je! 💗" : "Opgeslagen — vul gerust later de rest aan 🤍");
  go({view:"block",blockId:blockId});
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function renderInfo(){
  let html = topbar("Info & veiligheid", true);
  html += '<div class="card infobox">'+
    '<h3>Voor wie is dit schema</h3>'+
    '<p>3x per week een fullbody training, opgebouwd in 6 blokken van 2 weken (12 weken totaal). Focus op sterke enkels/voeten/onderbenen, billen, buik (rustig opgebouwd) en bovenlijf.</p>'+
    '<h3>Belangrijk om te weten</h3><ul>'+
    '<li>Dit schema vervangt geen medisch advies. Overleg bij twijfel met je fysiotherapeut of arts, zeker rond je enkel en je buik.</li>'+
    '<li>Stop direct bij scherpe of aanhoudende pijn — dat is iets anders dan normale spierpijn.</li>'+
    '<li>Kies liever een gewicht dat goed voelt dan te veel in één keer te willen — je mag altijd een stap terug doen naar een lichtere variant.</li>'+
    '<li>De enkel- en kuitoefeningen zitten in élke training, bewust — consistentie is wat je enkel sterker maakt.</li>'+
    '<li>De buikoefeningen bouwen rustig op: eerst ademhaling en lichte activatie, pas later plank/rotatie-oefeningen.</li>'+
    '</ul>'+
    '<h3>Hoe werkt de app</h3><ul>'+
    '<li>Tik op een oefening voor de uitleg en een logveld per set (kg + reps).</li>'+
    '<li>Vink een set af met het rondje rechts zodra je hem gedaan hebt.</li>'+
    '<li>Bij elke oefening zie je "Vorige keer" — het laatste gewicht/reps dat je hebt gelogd, waar dan ook in het schema. Zo zie je zwart-op-wit dat je vooruitgaat, en verschijnt er een 🔥 zodra je een set sterker maakt dan de vorige keer.</li>'+
    '<li>Alles wordt automatisch opgeslagen op dit toestel.</li>'+
    '</ul>'+
    '<h3>Over zichtbare resultaten</h3>'+
    '<p>Het schema is bewust opbouwend: gewicht, reps en sets gaan elk blok omhoog, zodat je spieren — inclusief je billen en je romp — steeds net iets meer te doen krijgen. Dat is wat ze sterker en strakker maakt. Hoe zichtbaar dat wordt (ook qua lichaamsvorm) hangt daarnaast sterk af van voeding en consistentie over de volle 12 weken — de app kan alleen de trainingskant regelen, de rest is aan jou en haar samen. Blijf gewoon elke keer een héél klein beetje meer proberen dan de vorige keer, dat is de kern.</p>'+
    '</div>';
  app.innerHTML = html;
}

/* ===================== INIT ===================== */
render();
const splashEl = document.getElementById("splash");
if(splashEl){
  let splashSeen = false;
  try{ splashSeen = sessionStorage.getItem("mb_splash_seen") === "1"; }catch(e){}
  if(splashSeen){
    splashEl.remove();
  } else {
    document.getElementById("splashGo").onclick = ()=>{
      try{ sessionStorage.setItem("mb_splash_seen","1"); }catch(e){}
      splashEl.classList.add("hide");
      setTimeout(()=>splashEl.remove(), 400);
    };
  }
}
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
